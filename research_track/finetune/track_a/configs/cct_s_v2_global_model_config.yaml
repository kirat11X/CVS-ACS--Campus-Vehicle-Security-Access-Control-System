# Compact Convolutional Transformer (CCT-S v2 Global) Architecture Config for fast-plate-ocr
model: cct
rescaling:
  scale: 0.00392156862745098  # 1/255
  offset: 0.0

tokenizer:
  blocks:
    - layer: Conv2D
      filters: 64
      kernel_size: 3
      strides: 1
      padding: same
    - layer: Activation
      activation: relu
    - layer: MaxPooling2D
      pool_size: 2
      strides: 2
      padding: same
    - layer: Conv2D
      filters: 128
      kernel_size: 3
      strides: 1
      padding: same
    - layer: Activation
      activation: relu
    - layer: MaxPooling2D
      pool_size: 2
      strides: 2
      padding: same
  patch_size: 1
  positional_emb: true

transformer_encoder:
  layers: 4
  heads: 4
  projection_dim: 128
  units:
    - 256
    - 128
  activation: gelu
  stochastic_depth: 0.1
  attention_dropout: 0.1
  mlp_dropout: 0.1
  head_mlp_dropout: 0.2
  token_reducer_heads: 2
  token_reducer_use_query_residual: false
  token_reducer_use_output_norm: false
  post_token_reducer_layers: 0
  region_pre_seqpool_layers: 0
  normalization: layer_norm
