name: CVS-ACS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint & Style Check (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: ruff check .

  typecheck:
    name: Type Consistency Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Typecheck Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests types-Pillow
          pip install -r backend/requirements.txt

      - name: Run Mypy on Backend
        run: mypy backend/

  security:
    name: Security Vulnerability Scan (Bandit SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST on Backend
        run: bandit -r backend/

  test-review-contracts:
    name: Research Track Review Suite (Track A, B, C Contracts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Review Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov jsonschema rapidfuzz

      - name: Run Review Test Suite with Coverage
        run: |
          pytest research_track/review/ \
            --cov=research_track/track_a/src \
            --cov=research_track/track_b/src \
            --cov=research_track/track_c/src \
            --cov-report=term-missing \
            --cov-fail-under=90

  test-scripts-e2e:
    name: Backend Core Features & 13 E2E Scenarios
    runs-on: ubuntu-latest
    env:
      SIMULATION_MODE: "true"
      AUTH_SECRET_KEY: "ci-test-ephemeral-secret-key-32chars-minimum-length"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov rapidfuzz

      - name: Run Scripts Pytest Suite
        run: pytest scripts/ -k "not regression"

      - name: Run All 13 E2E Operational Scenarios (Simulation Mode)
        run: python scripts/test_e2e.py --simulation

      - name: Run Automated Bug Tester Audit
        run: python research/cvs_acs_bug_tester.py
